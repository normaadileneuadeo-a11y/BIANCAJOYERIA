<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background luxury soft blush gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf5f9" />
      <stop offset="100%" stop-color="#f5deec" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b58a42" />
      <stop offset="45%" stop-color="#f3dc9e" />
      <stop offset="70%" stop-color="#dfb672" />
      <stop offset="100%" stop-color="#9e752e" />
    </linearGradient>

    <!-- Subtle radial glow for disc -->
    <radialGradient id="discGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fcf1f7" />
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a84d79" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base Rounded Background for PWA display -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Center Luxury Disc -->
  <circle cx="256" cy="256" r="210" fill="url(#discGlow)" stroke="#dfb672" stroke-width="4.5" filter="url(#luxuryShadow)" />

  <!-- Orbiting Ellipses (rotated -25 deg) -->
  <g transform="rotate(-25 256 256)">
    <!-- Lilac orbit -->
    <ellipse cx="256" cy="256" rx="195" ry="96" fill="none" stroke="#cbb3d9" stroke-width="6.5" opacity="0.9" />
    <!-- Gold orbit with slight 3D displacement -->
    <ellipse cx="259" cy="259" rx="195" ry="96" fill="none" stroke="#dfb672" stroke-width="4.5" opacity="0.85" />
  </g>

  <!-- Sparkle Star ✦ at top-right -->
  <path d="M 378,135 Q 378,162 405,162 Q 378,162 378,189 Q 378,162 351,162 Q 378,162 378,135 Z" fill="#dfb672" />
  <circle cx="378" cy="162" r="3" fill="#ffffff" />

  <!-- Romantic Heart ♡ at bottom-right -->
  <path d="M 374,345 C 374,332 358,322 346,334 C 334,322 318,332 318,345 C 318,364 346,382 346,382 C 346,382 374,364 374,345 Z" fill="#ba5489" />

  <!-- Monogram Letter "B" (Didone / Roman Luxury Serif) -->
  <g fill="url(#goldGrad)" transform="translate(10, 0)">
    <!-- Vertical stem and serifs -->
    <!-- Top serif -->
    <polygon points="175,138 245,138 245,152 225,152 225,360 248,360 248,374 172,374 172,360 195,360 195,152 175,152" />
    
    <!-- Top Bowl -->
    <path d="M 225,152 L 285,152 C 322,152 346,172 346,204 C 346,234 322,252 282,252 L 225,252 Z
             M 225,166 L 225,238 L 280,238 C 308,238 326,224 326,202 C 326,180 308,166 280,166 Z" fill-rule="evenodd" />

    <!-- Bottom Bowl -->
    <path d="M 225,248 L 292,248 C 334,248 360,268 360,306 C 360,344 332,364 286,364 L 225,364 Z
             M 225,262 L 225,350 L 284,350 C 316,350 338,334 338,306 C 338,278 316,262 284,262 Z" fill-rule="evenodd" />
  </g>
</svg>
